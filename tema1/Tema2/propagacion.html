<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Propagación</h1>
    <section>
        <h1>Sección</h1>
        <article>
            <h2>Artículo</h2>
            <div>
                <h3>Div</h3>
                <button>Botón</button>
            </div>
        </article>
    </section>
    <script>
        document.querySelector('section').addEventListener('click', (event) => console.log("acción del section"))
        document.querySelector('article').addEventListener('click', (event) => console.log("acción del articulo"), true)
        document.querySelector('div').addEventListener('click', (event) => console.log("acción del div"))
        document.querySelector('button').addEventListener('click', (event) => {
            console.log("acción del botón");
            event.stopPropagation();
        })


    </script>
</body>

</html>
