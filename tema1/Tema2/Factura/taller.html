<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura</title>
    <style>
        body {
            text-align: center;
            max-width: 650px;
            margin: 25px auto;
        }

        #addItem {
            display: flex;
            justify-content: space-around;
            gap: 10px;

        }
    </style>
</head>

<body>
    <h1>Sistema de Facturación</h1>
    <h2>Añadir Producto</h2>
    <section>
        <form>
            <div id="addItem">
                <span>Concepto: <input type="text"></span>
                <span> Cantidad: <input type="number" value="1"></span>
                <span>Precio: <input type="number"></span>
                <button>Insertar</button> </span>
            </div>
            <h2>Seleccionar Impuestos</h2>
            <span><input type="radio" name="tax" id="taxes1"> 5%</span>
            <span><input type="radio" name="tax" id="taxes2"> 10%</span>
            <span><input type="radio" name="tax" id="taxes3"> 15%</span>
            <span><input type="radio" name="tax" id="taxes4"> 20%</span>

        </form>
    </section>
    <section>
        <h2>Factura</h2>
        <table>
            <tr>
                <th>Concepto</th>
                <th>Cantidad</th>
                <th>Precio Unit.</th>
                <th>Precio Total</th>
                <th>Eliminar</th>
            </tr>
            <tr>

            </tr>
            <tfoot>
                <tr>
                    <td colspan="3">Subtotal:</td>

                </tr>
                <tr>
                    <td colspan="3">Tasa:</td>

                </tr>
                <tr>
                    <td colspan="3">Impuestos:</td>

                </tr>
                <tr>
                    <td colspan="3">TOTAL:</td>

                </tr>
            </tfoot>
        </table>
    </section>

</body>

</html>
