<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura</title>
    
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Sistema de Facturación</h1>
    <h2>Añadir Producto</h2>
    <section>
        <form>
            <div id="addItem">
                <span >Concepto: <input type="text" name="concept"></span>
                <span >Cantidad: <input type="number" value="1" name="quantity"></span>
                <span >Precio: <input type="number" name="price"></span>
                <button id="insert" type="button">Insertar</button> </span>
            </div>
            <h2>Seleccionar Impuestos</h2>
            <span><input type="radio" name="tax" id="taxes1" value="5"> 5%</span>
            <span><input type="radio" name="tax" id="taxes2" value="10"> 10%</span>
            <span><input type="radio" name="tax" id="taxes3" value="15"> 15%</span>
            <span><input type="radio" name="tax" id="taxes4" value="20" checked> 20%</span>

        </form>
    </section>
    <section>
        <h2>Factura</h2>
        <table>
            <tr>
                <th>Concepto</th>
                <th>Cantidad</th>
                <th>Precio Unit.</th>
                <th>Precio Total</th>
                <th>Eliminar</th>
            </tr>
            <tr>

            </tr>
            <tfoot>
                <tr>
                    <td colspan="3">Subtotal:</td>
                    <td></td>

                </tr>
                <tr>
                    <td colspan="3">Tasa:</td>
                    <td></td>

                </tr>
                <tr>
                    <td colspan="3">Impuestos:</td>
                    <td></td>

                </tr>
                <tr>
                    <td colspan="3">TOTAL:</td>
                    <td></td>

                </tr>
            </tfoot>
        </table>
    </section>

</body>

</html>
