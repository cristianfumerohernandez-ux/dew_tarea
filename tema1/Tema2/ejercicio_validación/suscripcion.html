<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción</title>
    <style>
        .error {
            color: red;
        }
        input:valid{
            border: 2px solid green;
        }
        input:invalid{
            border: 2px solid red;
        }
    </style>
    <script src="temas.js" defer></script>
</head>
<body>
    <h1>Formulario de Suscripción</h1>
    <form method="post" action="suscribe.php" id="suscripcionForm">
        <fieldset>
            <legend>Datos personales</legend>
            <p>

                <label for="nombre">Nombre: </label>
                <input type="text" name="nombre" id="nombre" minlength="3" required>
                <span class="error" id="errorNombre"></span>
            </p>
            <p>
                <label for="dni">DNI: </label>
                <input type="text" name="dni" id="dni"  minlength="10" maxlength="10"
                 required pattern="^\d{8}-[A-Z]$" placeholder="12345678-Y">
                <span class="error" id="errorDni"></span>
            </p>
        </fieldset>
        <fieldset>
            <legend>Tipo de Suscripción</legend>
            <span class="error" id="errorSuscripcion"></span>
            <input type="radio" name="tipo" id="basico" value="basico" checked >
            <label for="basico">Básico</label>
            <input type="radio" name="tipo" id="estandar" value="estandar" >
            <label for="estandar">Estándar</label>
            <input type="radio" name="tipo" id="premium" value="premium" >
            <label for="premium">Premium</label>
            <input type="radio" name="tipo" id="elite" value="elite" >
            <label for="elite">Élite</label>   
            <hr>   
            <span id="precio">1</span>      
        </fieldset>
        <fieldset>
            <legend>Temas</legend>
            <span class="error" id="errorTemas"></span>
            <div id="temasContainer">

            </div>        
        </fieldset>
        <p>
            <input type="reset" value="Borrar">
            <input type="submit" value="Suscribir">
        </p>
    </form>
</body>
</html>
