<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Básico </title>
    <style>
        *:user-invalid {
            background-color: lightcoral;
        }

        *:user-valid {
            background-color: lightgreen;
        }
    </style>
</head>

<body>
    <h1>Formulario Básico</h1>
    <form action="" id="form-basico">
        <p>
            <label for="name">Nombre</label>
            <input type="text" name="name" required pattern="\w{3,20}">
        </p>
        <p>
            <label for="age">Edad</label>
            <input type="number" name="age" id="age" min="18" max="99">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <button type="submit">Enviar</button>

        </p>

    </form>

    <script>
        const form = document.getElementById('form-basico');

        form.addEventListener('submit', (e)=>{
            e.preventDefault();
            
            const formData = new FormData(form);

            if (formData.get('age') % 2 == 0){
                console.log("es par");
                form.submit();
            }else{
                console.log("es impar")
                
            }
        })
    </script>

</body>

</html>
