<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            display: flex;
            gap: 10px;
        }
        #listOrigin{
            background-color: rgb(102, 230, 85);
            padding: 20px;
          
        }
        .selected{
            background-color: rgb(230, 102, 85);

        #listDestination{
            background-color: rgb(85, 100, 230);
            padding: 20px;
        }
    </style>
    <script src="dos_listados.js" defer></script>

<body>
    <h1>Crea dos listados</h1>
    <p>Crea dos listados. El primero tiene una lista de elementos. Se pueden seleccionar al hacer click. Pulsando un
        botón pasan los seleccionaos al otro listados
    </p>
    <p>
    <button onclick="changeElementLeft()">&lt; </button>
    Mueve los seleccionados
    <button onclick="changeElementRight()">&gt; </button>
    </p>
    <div id="container">
        
        <ul id="listOrigin">
            <li onclick="setSelected(this)">Elemento 1</li>
            <li>Elemento 2</li>
            <li>Elemento 3</li>
            <li>Elemento 4</li>
            <li>Elemento 5</li>
            
       
        </ul>
        <ul id="listDestination">
           
        </ul>
    </div>

</body>
