<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do</title>
    <style>
        .selected{
            background-color: lightgreen;
        }
    </style>
    <script src="to-do.js" defer ></script>
</head>
<body>
    <h1>Lista de tareas</h1>
    <p>
        <button onclick="sortTask()">Ordenar Alfabéticamente</button>
        <button onclick="setSelectAll()">Seleccionar todos</button>
        <button onclick="setSelectAll(false)">Deseleccionar todos </button>
        <button onclick="deleteSelected()">Borrar las seleccionadas</button>
    </p>


    <p>
        Nueva tarea:
        <input type="text" id="new-task">
        <button onclick="buttonInsertTask()">Crear</button>

    </p>
    <ul id="todo-list">
        <li ondblclick="deleteTask(this)" class="selected">Hacer los cuestionarios</li>
        <li ondblclick="deleteTask(this)">Preparar la cena</li>
    </ul>
</body>
</html>
